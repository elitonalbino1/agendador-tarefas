# Nome da aplicação
spring.application.name=agendador-tarefas

# Configuração do MongoDB (corrigido)
spring.data.mongodb.uri=mongodb://localhost:27017/db_agendador
spring.data.mongodb.database=db_agendador

# URL base do serviço de usuário
usuario.url=http://localhost:8080

# Porta do serviço agendador-tarefas
server.port=8081

# Chave JWT (igual em todos os microsserviços)
jwt.secret=sua-chave-secreta-super-segura-que-deve-ser-bem-longa

# Configuração Feign
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=basic

# Logs
logging.level.com.javanauta.agendadortarefas=INFO
logging.level.feign=DEBUG
